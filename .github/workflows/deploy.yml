name: Deploy verified Legal RAG revision

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional 40-character source revision; defaults to the triggering commit
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: legal-rag-production-release
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-legal-rag-prod
  WEB_APP: app-legal-rag-prod-278f1d
  LIVE_URL: https://app-legal-rag-prod-278f1d.azurewebsites.net
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact revision
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(printf '%s' "$SOURCE_SHA" | wc -c)" -eq 40
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
      - run: uv run ruff check . && uv run pytest
      - name: Verify deployment dependency artifact
        run: |
          uv export --format requirements-txt --no-hashes --no-dev --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Build immutable deployment archive
        run: zip -qr "legal-rag-$SOURCE_SHA.zip" . -x '.git/*' '.venv/*' 'graphify-out/*' '.agent-audit/*'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy exact archive
        run: |
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP" \
            --src-path "legal-rag-$SOURCE_SHA.zip" \
            --type zip \
            --restart false \
            --async true
          for attempt in $(seq 1 60); do
            logs="$(az webapp log deployment show --resource-group "$RESOURCE_GROUP" --name "$WEB_APP" --output json)"
            if printf '%s' "$logs" | jq -e --arg started "$started_at" \
              'any(.[]; .log_time >= $started and .message == "Deployment successful. deployer = OneDeploy deploymentPath = OneDeploy")' >/dev/null; then
              break
            fi
            test "$attempt" -lt 60
            sleep 10
          done
      - name: Stamp deployed source revision
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP" \
            --settings "PORTFOLIO_SOURCE_SHA=$SOURCE_SHA" \
            --output none
          az webapp stop --resource-group "$RESOURCE_GROUP" --name "$WEB_APP" --output none
          az webapp start --resource-group "$RESOURCE_GROUP" --name "$WEB_APP" --output none
      - name: Verify live deployment
        run: |
          for attempt in $(seq 1 30); do
            payload="$(curl --fail --silent --show-error "$LIVE_URL/healthz" || true)"
            if printf '%s' "$payload" | jq -e --arg sha "$SOURCE_SHA" '.status == "ok" and .source_sha == $sha' >/dev/null; then
              break
            fi
            test "$attempt" -lt 30
            sleep 10
          done
          curl --fail --silent --show-error --output /dev/null "$LIVE_URL/"
          curl --fail --silent --show-error --output /dev/null "$LIVE_URL/corpus"
          curl --fail --silent --show-error --output /dev/null "$LIVE_URL/evaluation"
      - name: Write release receipt
        run: |
          mkdir -p artifacts
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg deployedAt "$(date -u +%FT%TZ)" \
            --arg liveUrl "$LIVE_URL" \
            '{version:1, provider:"Azure App Service", sourceSha:$sourceSha, deployedAt:$deployedAt, liveUrl:$liveUrl, verified:true}' \
            > artifacts/release-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: legal-rag-release-${{ env.SOURCE_SHA }}
          path: artifacts/release-receipt.json
          if-no-files-found: error
