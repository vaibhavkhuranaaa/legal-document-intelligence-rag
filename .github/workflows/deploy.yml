name: Deploy approved Legal RAG revision

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved 40-character source revision
        required: true
        type: string
      approval_timestamp:
        description: Owner approval time in ISO-8601 UTC
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: legal-rag-production-release
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-legal-rag-prod
  WEB_APP: app-legal-rag-prod-278f1d
  LIVE_URL: https://app-legal-rag-prod-278f1d.azurewebsites.net

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify approved revision
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          test "$(printf '%s' '${{ inputs.source_sha }}' | wc -c)" -eq 40
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
      - run: uv run ruff check . && uv run pytest
      - name: Verify deployment dependency artifact
        run: |
          uv export --format requirements-txt --no-hashes --no-dev --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Build immutable deployment archive
        run: zip -qr legal-rag-${{ inputs.source_sha }}.zip . -x '.git/*' '.venv/*' 'graphify-out/*' '.agent-audit/*'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy exact archive
        run: >
          az webapp deploy
          --resource-group "$RESOURCE_GROUP"
          --name "$WEB_APP"
          --src-path "legal-rag-${{ inputs.source_sha }}.zip"
          --type zip
          --restart true
      - name: Stamp deployed source revision
        run: >
          az webapp config appsettings set
          --resource-group "$RESOURCE_GROUP"
          --name "$WEB_APP"
          --settings "PORTFOLIO_SOURCE_SHA=${{ inputs.source_sha }}"
          --output none
      - name: Verify live deployment
        run: |
          for attempt in $(seq 1 30); do
            payload="$(curl --fail --silent --show-error "$LIVE_URL/healthz" || true)"
            if printf '%s' "$payload" | jq -e --arg sha "${{ inputs.source_sha }}" '.status == "ok" and .source_sha == $sha' >/dev/null; then
              break
            fi
            test "$attempt" -lt 30
            sleep 10
          done
          curl --fail --silent --show-error --output /dev/null "$LIVE_URL/"
          curl --fail --silent --show-error --output /dev/null "$LIVE_URL/corpus"
          curl --fail --silent --show-error --output /dev/null "$LIVE_URL/evaluation"
      - name: Write release receipt
        run: |
          mkdir -p artifacts
          jq -n \
            --arg sourceSha "${{ inputs.source_sha }}" \
            --arg approvedAt "${{ inputs.approval_timestamp }}" \
            --arg deployedAt "$(date -u +%FT%TZ)" \
            --arg liveUrl "$LIVE_URL" \
            '{version:1, provider:"Azure App Service", sourceSha:$sourceSha, approvedAt:$approvedAt, deployedAt:$deployedAt, liveUrl:$liveUrl, verified:true}' \
            > artifacts/release-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: legal-rag-release-${{ inputs.source_sha }}
          path: artifacts/release-receipt.json
          if-no-files-found: error
      - name: Request exact-SHA portfolio admission
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          PORTFOLIO_REPOSITORY: ${{ vars.PORTFOLIO_REPOSITORY }}
        run: >
          gh api --method POST "repos/${PORTFOLIO_REPOSITORY}/dispatches"
          -f event_type=project-manifest-ready
          -f client_payload[repository]="$GITHUB_REPOSITORY"
          -f client_payload[ref]="${{ inputs.source_sha }}"
          -f client_payload[manifest_path]="portfolio/project.json"
